server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;   # límite de carga (la API valida 10 MB)

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # API en el mismo origen: cookies SameSite sin CORS. Nunca se cachea.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
  }

  # El service worker y el manifiesto se revalidan para recibir actualizaciones.
  location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
